[package]
name = "fringe-frontend"
version = "0.1.0"
edition = "2024"
description = "Web frontend for the fringe radio interferometer simulator"
license = "MIT"
repository = "https://github.com/samvandenende/fringe-frontend"

[[bin]]
name = "fringe-frontend"
path = "src/main.rs"

[dependencies]
# The exact commit is pinned in Cargo.lock; `cargo update -p fringe` moves to the latest.
fringe = { git = "https://github.com/samvandenende/fringe" }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
num-complex = "0.4.6"
rand = "0.9.2"
rayon = "1.10"
rustfft = "6.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

# The simulator and FFT/imaging code are far too slow unoptimised; keep dev builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
